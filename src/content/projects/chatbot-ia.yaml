  en: AI Chatbot (ICEBERG IA)
summary:
  pt: Chatbot de terminal que roda o modelo DeepSeek-R1 8B localmente via Ollama, com histórico de conversas persistente.
  en: Terminal chatbot running the DeepSeek-R1 8B model locally through Ollama, with persistent conversation history.
problem:
