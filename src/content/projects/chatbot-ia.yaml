  en: Using AI assistants usually depends on cloud services. ICEBERG IA runs a language model locally, with a lightweight terminal interface.
features:
  pt:
    - Conversa com o modelo DeepSeek-R1 8B executado no Ollama.
    - Persistência do histórico de conversas.
    - Comandos interativos no terminal.
    - Interface otimizada para uso eficiente de recursos.
  en:
    - Chat with the DeepSeek-R1 8B model running on Ollama.
    - Persistent conversation history.
    - Interactive terminal commands.
    - Interface optimized for efficient resource use.
