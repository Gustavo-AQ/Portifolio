title:
  pt: GAQ Jobs Web
  en: GAQ Jobs Web
summary:
  pt: Sistema de busca e acompanhamento de vagas com IA. Um coletor e um pré-filtro em Python descartam cerca de 80% das vagas sem gastar tokens, e só o restante vai para a análise do assistente, que grava tudo no PostgreSQL via n8n e MCP.
  en: AI-assisted job search and tracking system. A Python collector and pre-filter discard about 80% of postings without spending any tokens, and only the rest reaches the assistant's analysis, which saves everything to PostgreSQL through n8n and MCP.
problem:
  pt: Procurar vagas em vários sites e pedir para uma IA avaliar cada anúncio é lento e gasta muitos tokens com vagas que claramente não servem. O GAQ Jobs automatiza a coleta, elimina por regras simples o que não encaixa no perfil e deixa para a IA só a leitura fina. As vagas aprovadas e cada candidatura ficam organizadas em um painel privado.
  en: Searching several job boards and asking an AI to evaluate every posting is slow and wastes tokens on jobs that are clearly a poor fit. GAQ Jobs automates collection, drops what doesn't match the profile with simple rules and leaves only the fine-grained reading to the AI. Approved jobs and every application are organized in a private dashboard.
features:
  pt:
    - Coletor HTTP sem login que busca vagas em 9 fontes públicas (Gupy, Himalayas, InfoJobs, Catho, Vagas.com.br, NerdIn, backend-br, Programathor e Remotar), respeitando pausas entre pedidos.
    - Pré-filtro com regras eliminatórias editáveis (nível sênior, idioma obrigatório, horário noturno, local presencial fora da UF, piso salarial e duplicatas) e nota de 0 a 100 por habilidades, área, nível e modelo de trabalho.
    - Assistente de IA que lê as vagas aprovadas e também posts de recrutadores no LinkedIn, Padrinho e Robô de Vagas, dá a nota de aderência e escolhe as 5 melhores da semana.
    - Servidor MCP no n8n com 4 ferramentas (salvar_vaga, consultar_vagas, atualizar_status_vaga e descrever_banco) que acessam o banco só por funções PostgreSQL específicas.
    - Painel web com filtros por modalidade, contrato, aderência e data de coleta, além de busca, ordenação e paginação.
    - Acompanhamento de candidaturas, entrevistas, testes, ofertas e resultados, com observações pessoais.
    - Três famílias de status auditáveis (notificação, candidatura e disponibilidade), com histórico de cada mudança.
    - Login próprio com Argon2id, sessões em cookies protegidos, validação de origem, CSRF e perfis de administrador e somente leitura.
    - Migrador de schema que verifica e aplica apenas migrações conhecidas, sem apagar dados.
  en:
    - HTTP collector with no login that fetches jobs from 9 public sources (Gupy, Himalayas, InfoJobs, Catho, Vagas.com.br, NerdIn, backend-br, Programathor and Remotar), with polite delays between requests.
    - Pre-filter with editable knockout rules (senior level, required language, night shift, on-site outside the state, salary floor and duplicates) and a 0 to 100 score based on skills, area, level and work model.
    - AI assistant that reads the approved jobs as well as recruiter posts on LinkedIn, Padrinho and Robô de Vagas, assigns a fit score and picks the top 5 of the week.
    - MCP server in n8n with 4 tools (salvar_vaga, consultar_vagas, atualizar_status_vaga and descrever_banco) that reach the database only through specific PostgreSQL functions.
    - Web dashboard with filters by work model, contract, fit score and collection date, plus search, sorting and pagination.
    - Tracking of applications, interviews, tests, offers and results, with personal notes.
    - Three auditable status families (notification, application and availability), with a history of every change.
    - Own login with Argon2id, sessions in protected cookies, origin validation, CSRF and admin and read-only roles.
    - Schema migrator that checks and applies only known migrations, without deleting data.
