sections:
  - title:
      pt: Pipeline
      en: Pipeline
    items:
      pt:
        - "Fontes públicas (API ou HTML) passam pelo coletor e depois pelo pré-filtro."
        - "O assistente de IA recebe o que sobrou do pré-filtro e as fontes lidas no navegador, já logado e somente leitura."
        - "O assistente grava a vaga, a nota de aderência e a nota do pré-filtro pelo servidor MCP do n8n."
        - "O PostgreSQL (schema empregos) é a fonte única; o painel só lê e atualiza o que já está no banco."
      en:
        - "Public sources (API or HTML) go through the collector and then the pre-filter."
        - "The AI assistant receives what passed the pre-filter plus sources read in the browser, logged in and read-only."
        - "The assistant saves the job, the fit score and the pre-filter score through the n8n MCP server."
        - "PostgreSQL (empregos schema) is the single source of truth; the dashboard only reads and updates what is already there."
  - title:
      pt: Arquitetura e infraestrutura
      en: Architecture and infrastructure
    items:
      pt:
        - "Frontend em React 19, TypeScript e Vite, servido por Nginx."
        - "API em FastAPI com SQLAlchemy e psycopg; o frontend nunca acessa SQL diretamente."
        - "PostgreSQL 18 com 5 tabelas (vagas, histórico de status, usuários, sessões e tentativas de login), funções MCP e trigger de auditoria."
        - "Deploy com Docker Compose no Coolify, reaproveitando o PostgreSQL existente no servidor Oracle, com variações gerenciada, independente e de laboratório."
        - "CI no GitHub Actions com testes do backend (pytest), do coletor e do pré-filtro, build do frontend e validação dos arquivos Compose."
      en:
        - "Frontend in React 19, TypeScript and Vite, served by Nginx."
        - "API in FastAPI with SQLAlchemy and psycopg; the frontend never touches SQL directly."
        - "PostgreSQL 18 with 5 tables (jobs, status history, users, sessions and login attempts), MCP functions and an audit trigger."
        - "Deployed with Docker Compose on Coolify, reusing the existing PostgreSQL on the Oracle server, with managed, standalone and lab variants."
        - "CI on GitHub Actions with backend tests (pytest), collector and pre-filter tests, frontend build and Compose file validation."
results:
  pt:
    - Em produção em jobs.gaqtech.dev, com acesso restrito por login.
    - Coletor e pré-filtro usam só a biblioteca padrão do Python.
  en:
    - In production at jobs.gaqtech.dev, with login-restricted access.
    - Collector and pre-filter use only the Python standard library.
